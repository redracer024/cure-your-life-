# Render Blueprint for BodySignal
#
# This Blueprint is deliberately SECRET-FREE. All secret values are injected
# through the Render Dashboard (or Render CLI) as environment variables.
# See docs/render-deployment.md for the full configuration checklist.
#
# Deploy:   render.com > New > Blueprint > Connect this repo > Select branch
# Runtime:  Docker (uses the repo's Dockerfile)
#
# Do NOT commit real secrets here. Only names are declared below.

services:
  - type: web
    name: bodysignal
    runtime: docker
    # Branch to deploy from. The production candidate currently lives on the
    # experiment branch. Merge to main first per your branch policy if required.
    branch: experiment/3d-medical-ui
    # Build & start are driven entirely by the Dockerfile.
    # No explicit build/start commands are needed here.
    healthCheckPath: /healthz
    autoDeploy: true
    # ── Build-time env (public VITE_* only) ──────────────────────────────
    # Vite inlines VITE_* values into the JS bundle at BUILD time. The Dockerfile
    # declares ARG VITE_* for these PUBLIC frontend values and exports them as ENV
    # so Vite reads them via process.env during "RUN npm run build".
    # Render auto-passes declared envVars as Docker build args when they match ARG
    # names, so the build stage receives these values.
    # Server secrets (SUPABASE_SERVICE_ROLE_KEY, STRIPE_*, GEMINI_*) are NOT
    # declared as ARG in the Dockerfile — they are runtime-only and never baked in.
    # Environment variables are declared by NAME only.
    # Render will prompt you to supply values during provisioning.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_PREMIUM
        value: "false"
      - key: APP_URL
        # REQUIRED: set to the production origin.
        # CURRENT LIVE RENDER ORIGIN: https://bodysignal-xa18.onrender.com
        # The server fails closed (startup throws) if this is unset in production.
        # When a future custom domain is attached, update this value to the new domain.
        sync: wait_for_input
      - key: VITE_SUPABASE_URL
        # CANONICAL production frontend variable (build-time, public).
        sync: wait_for_input
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        # CANONICAL production frontend key (build-time, public).
        # Modern format: sb_publishable_...  (preferred over VITE_SUPABASE_ANON_KEY)
        sync: wait_for_input
      - key: VITE_SUPABASE_ANON_KEY
        # DEPRECATED alias. Retained for backward compatibility only.
        # supabaseClient.ts checks PUBLISHABLE_KEY first, then ANON_KEY.
        sync: wait_for_input
      - key: SUPABASE_URL
        # Server-side origin (runtime). Same value as VITE_SUPABASE_URL.
        sync: wait_for_input
      - key: SUPABASE_SERVICE_ROLE_KEY
        # Server secret (runtime-only, modern format: sb_secret_...)
        # NEVER passed as a Docker build arg — not baked into the image.
        sync: wait_for_input
      - key: STRIPE_SECRET_KEY
        sync: wait_for_input
      - key: STRIPE_WEBHOOK_SECRET
        sync: wait_for_input
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: wait_for_input
      - key: STRIPE_PRICE_ID_ANNUAL
        sync: wait_for_input
      - key: STRIPE_PRICE_ID
        sync: wait_for_input
      - key: GEMINI_API_KEY
        sync: wait_for_input
